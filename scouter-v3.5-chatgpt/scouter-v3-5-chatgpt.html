function targetCard(t){if(!t)return '<div class="empty">Capture or select a target.</div>';return `<div class="card-head">${b('← Back to targets','back','class="mobile-only text"')}<div class="eyebrow">TARGET CARD / ${t.user.lane==='parked-trades'?'SEPARATE PILOT':'DIGITAL SERVICES'}</div><div class="row"><h2>${escape(t.provider.name)}</h2>${b('Edit snapshot','snapshot','class="quiet small"')}</div><p>${escape(t.provider.category)} · ${escape(t.user.method)}</p>${t.user.lane==='parked-trades'?'<div class="notice purple-note">Parked trades pilot. This record is excluded from the digital-services Day-7 test. Trades workflows are not implemented.</div>':''}</div><div class="tabs" role="tablist" aria-label="Target Card sections">${[['understand','Understand'],['choose','Decide & offer'],['outreach','Outreach'],['money','Outcomes'],['log','Activity']].map(([k,label])=>`<button role="tab" data-action="section" data-key="${k}" aria-selected="${section===k}" class="${section===k?'selected':''}">${label}</button>`).join('')}</div><div class="card-body" role="tabpanel">${section==='understand'?understand(t):section==='choose'?choose(t):section==='outreach'?outreach(t):section==='money'?outcomes(t):activityView(t)}</div>`;}
function understand(t){const p=t.provider,s=score(p,state.weights),acts=state.activities.filter(a=>a.targetId===t.id&&a.ownerWords.trim());return `<div class="score-box"><div class="row"><div><span class="eyebrow">OPPORTUNITY SCORE / PRIORITIZATION HYPOTHESIS</span><div class="score-reading">${s.points===null?'—':s.points}<span>/100 ${s.coverage<100?'partial':''}</span></div></div><div class="coverage"><b>${s.coverage}%</b><span>evidence coverage</span></div></div><div class="coverage-track"><span style="width:${s.coverage}%"></span></div><p class="hint">Unknown components earn no assumed points. Coverage is shown separately; this score never estimates buying intent.</p><details><summary>Show the scoring rule and every component</summary>${s.rows.map(r=>`<div class="score-component"><div class="row"><strong>${r.label}</strong><span>${r.known?(r.weight*r.factor).toFixed(1):'Unknown'} / ${r.weight}</span></div><p>${escape(r.why)}</p></div>`).join('')}<p class="hint">Only a dated, sourced Google Places snapshot is eligible. Other source ratings are retained but do not enter this score. Weights are adjustable in My toolkit.</p></details></div><details><summary>Provider snapshot · preserved separately from your work</summary><dl><dt>Place ID</dt><dd>${escape(p.placeId||'Not supplied')}</dd><dt>Website listing</dt><dd>${escape(p.websiteState)} ${p.website?safeLink(p.website):''}</dd><dt>Rating / reviews</dt><dd>${p.rating??'Unknown'} / ${p.reviews??'Unknown'}</dd><dt>Phone listing</dt><dd>${escape(p.phoneState)}${p.phone?' · '+escape(p.phone):''}</dd><dt>Source / observed</dt><dd>${escape(p.sourceKind)} · ${safeLink(p.sourceUrl)} · ${escape(p.observed||'Date not recorded')}</dd></dl><p class="hint">“Not listed in Places” does not mean no website exists. An empty or failed lookup is Unknown.</p>${t.providerHistory.length?`<details><summary>${t.providerHistory.length} previous snapshot(s)</summary><pre>${escape(JSON.stringify(t.providerHistory,null,2))}</pre></details>`:''}</details><div class="section-heading"><div><span class="eyebrow">PUBLIC EVIDENCE</span><h3>Facts, signals, hypotheses, unknowns</h3></div>${b('+ Evidence','evidence','class="quiet small"')}</div>${t.evidence.map(e=>`<article class="evidence ${e.kind.toLowerCase()}"><div class="row">${tag(e.kind,e.kind.toLowerCase())}${b('Edit','editEvidence',`data-key="${escape(e.id)}" class="text"`)}</div><p>${escape(e.claim)}</p><small>${safeLink(e.url)} · ${escape(e.date)}</small></article>`).join('')||'<div class="empty">No sourced public claims yet. Capture observations without turning them into owner pain.</div>'}<div class="question"><span class="eyebrow">ASK THE OWNER</span><p>${escape(t.user.question||'Write a specific question in Decide & offer before pursuing.')}</p></div><div class="section-heading"><div><span class="eyebrow">OWNER REPORTS</span><h3>Words first. Interpretation second.</h3></div>${b('+ Conversation','conversation','class="quiet small"')}</div>${acts.map(a=>`<blockquote>“${escape(a.ownerWords)}”<footer>${escape(a.speaker||'Speaker unverified')} · ${escape(a.date)} ${tag(a.ownerVerified?(a.ownerPain?'Owner pain recorded':'Owner statement'):'Unverified report',a.ownerPain?'lime':'')}</footer><p>${escape(a.notes)}</p></blockquote>`).join('')||'<div class="empty">No owner statements recorded. A pending quote alone does not prove pain.</div>'}`;}
function choose(t){const u=t.user;return `<form id="decision-form"><div class="form-grid">${pick('Pursuit decision','decision',['Undecided','Pursue','Park','Drop'],u.decision)}${pick('Stage in your workflow','stage',STAGES,u.stage)}${pick('Research method','method',METHODS,u.method)}${field('Next action date','due',u.due,'date')}</div>${area('Tailored discovery question','question',u.question,'required')}${area('Counterevidence — what might already work well?','counter',u.counter)}${area('Drop condition — what would change your decision?','drop',u.drop)}${area('Reason, user notes and delivery constraints','notes',u.notes)}${field('Next action','nextAction',u.nextAction)}<p class="hint">Pursue, Park and Drop require a question, counterevidence and a drop condition. Silence is an unanswered attempt, not a rejection.</p><h3>Candidate offer / delivery fit</h3>${pick('Service to consider','serviceId',[['','Choose after understanding the result'],...state.services.map(s=>[s.id,s.name+(s.confirmed?' · capability confirmed':' · capability unconfirmed')])],u.serviceId)}${tick('I can deliver this specific scope within my current tools, time and limits.','deliveryConfirmed',u.deliveryConfirmed)}${area('Owner’s wanted result','ownerResult',u.ownerResult)}${area('Your problem interpretation / supporting activity IDs','problem',u.problem)}<p class="hint">${offerReady(state,t)?'Owner evidence and delivery prerequisites are recorded. Scope a small offer without guaranteeing results.':'Treat the service as a hypothesis until owner pain, a wanted result and your delivery capability are recorded.'}</p><button class="primary" type="submit">Save decision & fit</button></form>`;}
function outreach(t){return `<div class="notice">Drafts ask to learn. No message is sent by this app. Mark Sent only after you manually send the exact reviewed text.</div><form id="route-form">${field('Reviewed contact route / recipient','contact',t.user.contact)}${field('Channel','channel',t.user.channel)}${tick('I verified this is the business’s intended contact route.','contactVerified',t.user.contactVerified)}<button type="submit" class="quiet">Save contact review</button></form><div class="section-heading"><h3>Draft → Reviewed → Sent</h3>${b('+ Learning draft','newDraft','class="primary small"')}</div>${t.outreach.slice().reverse().map(d=>`<article class="message"><div class="row">${tag(d.status,d.status==='Sent'?'lime':'') }<small>${escape(d.created)}</small></div><h4>${escape(d.subject)}</h4><pre>${escape(d.body)}</pre>${d.status==='Sent'?`<small>Recorded sent ${escape(d.sentDate)} · ${escape(d.channel)} · ${escape(d.recipient)}</small>`:`<div class="actions">${b('Edit draft','editDraft',`data-key="${escape(d.id)}" class="quiet small"`)}${d.status==='Draft'?b('Mark reviewed','reviewDraft',`data-key="${escape(d.id)}" class="quiet small"`):b('Record manual send','sendRecord',`data-key="${escape(d.id)}" class="primary small"`)}${b('Copy text','copyDraft',`data-key="${escape(d.id)}" class="quiet small"`)}</div>`}</article>`).join('')||'<div class="empty">No drafts yet. Add your identity in My toolkit, then use the tailored question to draft a learning message.</div>'}`;}
function outcomes(t){const m=ledger([t]);return `<div class="mini-stats">${stat('QUOTED',dollars(m.quoted))}${stat('RECEIVED',dollars(m.received))}${stat('KNOWN NET',dollars(m.knownNet),'Known payments less known expenses; before tax')}</div><div class="section-heading"><h3>Itemized quotes</h3>${b('+ Record quote','quote','class="quiet small"')}</div><p class="hint">Record existing quotes accurately. A pending, sent or accepted quote is not received money. New scope should follow owner discovery and confirmed delivery.</p>${t.quotes.map(q=>`<article class="commercial"><div class="row"><h4>${escape(q.title)}</h4>${tag(q.status)}</div>${q.items.map(i=>`<div class="quote-line"><span>${escape(i.description)} <small>${i.quantity} × ${dollars(i.unit)}</small></span><b>${dollars(Math.round(i.quantity*i.unit*100)/100)}</b></div>`).join('')}<div class="row total"><strong>Total</strong><strong>${dollars(quoteTotal(q))}</strong></div><small>${escape(q.reference)} · ${escape(q.date||'Quote date not recorded')}</small><p>${escape(q.note)}</p>${b('Edit quote','editQuote',`data-key="${escape(q.id)}" class="quiet small"`)}</article>`).join('')||'<div class="empty">No quotes recorded.</div>'}<div class="section-heading"><h3>Actual payments & expenses</h3><div class="actions">${b('+ Payment','payment','class="quiet small"')}${b('+ Expense','expense','class="quiet small"')}</div></div><p class="hint">Blank amount means unrecorded. Use a unique reference per receipt; edit corrections instead of adding duplicates. ${m.missingPayments+m.missingExpenses} entries have no recorded amount.</p>${['payments','expenses'].flatMap(kind=>t[kind].map(p=>`<article class="transaction"><div class="row"><strong>${kind==='payments'?'Received payment':'Expense'} · ${dollars(p.amount)}</strong>${b('Edit',kind==='payments'?'editPayment':'editExpense',`data-key="${escape(p.id)}" class="text"`)}</div><p>${escape(p.note)}</p><small>${escape(p.reference)} · ${escape(p.date)}</small></article>`)).join('')||'<div class="empty">No payment or expense records.</div>'}<div class="section-heading"><div><span class="eyebrow purple">ODD JOBS</span><h3>Episode tie-ins</h3></div>${b('+ Episode note','episode','class="quiet small"')}</div>${t.episodes.map(e=>`<article class="episode"><div class="row"><h4>${escape(e.title)}</h4>${tag(e.status)}</div><p>${escape(e.note)}</p>${e.url?safeLink(e.url):''}${b('Edit','editEpisode',`data-key="${escape(e.id)}" class="text"`)}</article>`).join('')||'<div class="empty">Optional episode journal. Record filming permission and what you learned; no publishing tools are connected.</div>'}`;}
function activityView(t){const acts=state.activities.filter(a=>a.targetId===t.id),research=acts.filter(a=>a.type==='Research');return `<div class="row"><h3>Research & pursuit history</h3>${b('+ Activity','activity','class="primary small"')}</div><p class="hint">Research: ${mins(knownSum(research.map(a=>a.minutes)))}. ${research.filter(a=>a.minutes===null).length} research entries missing time.</p>${acts.slice().reverse().map(a=>activityCard(a)).join('')||'<div class="empty">No timed work or contact history has been assumed. Log your next session.</div>'}`;}
function activityCard(a){return `<article class="activity"><div class="row"><strong>${escape(a.type)} · ${mins(a.minutes)}</strong>${b('Edit','editActivity',`data-key="${escape(a.id)}" class="text"`)}</div><small>${escape(a.date)} · ${escape(a.method)} · ${escape(nameOf(a.targetId))}</small><p>${escape(a.notes)}</p>${a.friction?`<p class="gold">Friction: ${escape(a.friction)}</p>`:''}${a.ownerWords?`<p>Owner report: “${escape(a.ownerWords)}”</p>`:''}</article>`;}
function discoverView(){return header('DISCOVER / MANUAL INTAKE','Capture a possibility. Keep the context.','Choose any business category. Save provider observations separately from your decision, notes and outcomes.',b('+ Capture a target','capture','class="primary"'))+`<section class="panel"><h2>Start with a source you can check.</h2><p>Capture a business’s identity, Place ID if available, actual website URL, rating, review count and phone-listing state. A failed retrieval stays Unknown.</p><div class="workflow"><span>Discover</span><i>→</i><span>Understand</span><i>→</i><span>Choose offer</span><i>→</i><span>Save</span><i>→</i><span>Draft outreach</span><i>→</i><span>Track outcome</span></div><p class="hint">Matching Place IDs are blocked. Matching names are allowed so separate branches survive. Manual entries without a Place ID keep a distinct local ID.</p></section><section class="panel"><div class="row"><h3>Discarded candidates still cost time.</h3>${b('Log General research','general','class="quiet"')}</div><p>Record failed searches, awkward steps and minutes under the correct method. They belong in the efficiency comparison even when you save no lead.</p></section>`;}
function reviewView(){const m=reviewMetrics(state),methods=METHODS.map(method=>[method,reviewMetrics(state,method)]);return header('VALIDATION / DIGITAL SERVICES ONLY','Does structure make the search worthwhile?','Compare recorded effort and owner evidence before claiming an advantage.')+`<div class="notice ${m.ownerPain?'':'gold-note'}">${m.ownerPain?m.ownerPain+' targets have logged owner pain in the test window. Review the exact statements and delivery fit.':'No verified owner pain is logged in this test window. The test remains unvalidated.'}</div><form id="experiment-form" class="panel"><div class="form-grid">${field('Start date (Boise)','start',state.experiment.start,'date','required')}${field('Day-7 / end date','end',state.experiment.end,'date','required')}</div>${area('Baseline plan — comparable batch, service, geography and time budget','baselinePlan',state.experiment.baselinePlan)}<button type="submit" class="quiet">Save test window & plan</button></form><div class="stats">${stat('DECISIONS / PURSUE',m.decisions+' / '+m.chosen,'Current decisions, not a historical snapshot')}${stat('RESEARCH',mins(m.research),'Includes General / discarded candidates')}${stat('ALL LOGGED TIME',mins(m.minutes),m.missingTime+' entries missing time')}${stat('RECEIVED IN WINDOW',dollars(m.received),m.missingPayments+' payment entries missing amount')}</div><section class="panel"><h3>Compare the methods</h3><div class="table-wrap"><table><thead><tr><th>Method</th><th>Targets</th><th>Research</th><th>Outreach</th><th>Responses</th><th>Conversations</th><th>Owner pain</th><th>Friction</th></tr></thead><tbody>${methods.map(([method,x])=>`<tr><td>${method}</td><td>${x.businesses}</td><td>${mins(x.research)}</td><td>${x.counts.Outreach}</td><td>${x.counts.Response}</td><td>${x.counts.Conversation}</td><td>${x.ownerPain}</td><td>${x.friction}</td></tr>`).join('')}</tbody></table></div><p class="hint">${methods[1][1].activities?'Assess whether the batches were comparable before concluding that structure helped.':'No random-prospecting activity is recorded. There is no evidence of a time advantage yet.'} Counts are recorded events, not proof that nothing happened.</p><p class="hint">${m.quotes} dated quote records · ${m.paidRecords} dated payment records · ${m.undatedQuotes} undated quotes excluded. Later responses remain in the activity log; they are not treated as rejection. The parked tiling pilot is excluded.</p></section><form id="synthesis-form" class="panel"><h3>Day-7 synthesis</h3>${area('What was worth pursuing? Include target / activity IDs.','worth',state.experiment.worth)}${area('Which hypotheses weakened? Distinguish unanswered from declined.','weakened',state.experiment.weakened)}${area('What is still missing?','missing',state.experiment.missing)}${area('Comparison conclusion: time, quality of opportunities, friction and limits','conclusion',state.experiment.conclusion)}${area('Smallest useful next manual test','next',state.experiment.next)}<button class="primary" type="submit">Save review</button></form><section class="panel"><div class="row"><h3>General research log</h3>${b('+ General activity','general','class="quiet"')}</div>${state.activities.filter(a=>a.targetId==='General').map(activityCard).join('')||'<p class="hint">No discarded-candidate time recorded yet.</p>'}</section>`;}
function ledgerView(){const digital=state.targets.filter(t=>t.user.lane==='digital-services'),m=ledger(digital);return header('COMMERCIAL RECORDS / DIGITAL SERVICES','A quote is a proposal. Payment is a record.','Track amounts separately so the learning loop stays grounded.')+`<div class="stats">${stat('ACTIVE QUOTED AMOUNTS',dollars(m.quoted),'Excludes declined and voided quotes')}${stat('PAYMENTS RECEIVED',dollars(m.received),m.missingPayments+' entries missing amount')}${stat('EXPENSES RECORDED',dollars(m.spent),m.missingExpenses+' entries missing amount')}${stat('KNOWN NET BEFORE TAX',dollars(m.knownNet),'Known receipts less known expenses')}</div><div class="panel"><h3>Per-target ledger</h3><div class="table-wrap"><table><thead><tr><th>Target</th><th>Quoted</th><th>Received</th><th>Expenses</th><th>Known net</th><th></th></tr></thead><tbody>${digital.map(t=>{const x=ledger([t]);return `<tr><td>${escape(t.provider.name)}</td><td>${dollars(x.quoted)}</td><td>${dollars(x.received)}</td><td>${dollars(x.spent)}</td><td>${dollars(x.knownNet)}</td><td>${b('Open outcomes','targetMoney',`data-key="${escape(t.id)}" class="quiet small"`)}</td></tr>`;}).join('')}</tbody></table></div><p class="hint">Partial records give a known net, not a complete profit statement. The seeded $1,250 pending quote has no assumed line-item scope, send date, acceptance or payment. Tiling is kept outside these digital totals.</p></div>`;}
function settingsView(){return header('YOUR TOOLKIT / CAPABILITY BEFORE OFFER','Build around work you can deliver.','Your services and constraints guide the opportunity. Connections can come later.')+`<form id="profile-form" class="panel"><div class="form-grid">${field('Your name / truthful draft identity','name',state.profile.name)}${field('Availability','availability',state.profile.availability)}${field('Travel radius / remote preference','radius',state.profile.radius)}${field('Goals / preferred job size','goals',state.profile.goals)}</div>${area('Current skills and experience','skills',state.profile.skills)}${area('Tools and quality-review process','tools',state.profile.tools)}${area('Constraints / work off limits / costs','limits',state.profile.limits)}${field('Permitted contact channels','channels',state.profile.channels)}<button type="submit" class="primary">Save profile</button></form><section class="panel"><div class="row"><h3>Service catalog</h3>${b('+ Service','service','class="quiet"')}</div>${state.services.map(s=>`<article class="service"><div class="row"><strong>${escape(s.name)}</strong>${b('Edit','editService',`data-key="${escape(s.id)}" class="quiet small"`)}</div><p>${escape(s.scope)}</p>${tag(s.confirmed?'Capability confirmed':'Capability unconfirmed',s.confirmed?'lime':'')}</article>`).join('')}</section><form id="weights-form" class="panel"><h3>Score calibration — an untested rule</h3><p class="hint">Default weights are 50 / 20 / 20 / 10. They prioritize investigation, never diagnose a business or estimate purchase likelihood. Totals are normalized to 100; unknown evidence is not normalized away.</p><div class="form-grid">${field('Website not listed weight','website',state.weights.website,'number','min="0" max="100" required')}${field('Rating weight','rating',state.weights.rating,'number','min="0" max="100" required')}${field('Review volume weight','reviews',state.weights.reviews,'number','min="0" max="100" required')}${field('Phone listed weight','phone',state.weights.phone,'number','min="0" max="100" required')}${field('Top review-count band','reviewCap',state.weights.reviewCap,'number','min="1" max="1000000" required')}</div><button type="submit" class="quiet">Save starting weights</button></form><section class="panel"><h3>Future extension points</h3><p>Discover captures candidates. Intelligence explains evidence. Workbench will guide delivery. Ops can grow beyond this small ledger. Trades requires a separate pilot and workflow.</p><p class="hint">This file has no API keys, remote fonts, hidden requests, contact sender or fulfillment engine. LocalStorage may behave differently for file URLs in different browsers; JSON backup is your portable record.</p></section>`;}
function modal(title,html,formId){dialog.innerHTML=`<div class="dialog-head"><h2>${title}</h2>${b('✕','close','class="text" aria-label="Close dialog"')}</div><form id="${formId}">${html}<div class="actions"><button type="submit" class="primary">Save</button>${b('Cancel','close','class="quiet"')}</div><p class="error" role="alert"></p></form>`;dialog.showModal();}
function snapshotForm(edit=false){const p=edit?target().provider:snapshot();modal(edit?'Update provider snapshot':'Capture a target',`<input type="hidden" name="recordKey" value="${edit?escape(target().id):''}"><p class="hint">Save actual observations. Leave missing or failed retrievals Unknown. Earlier snapshots are retained when you update.</p><div class="form-grid">${field('Business name','name',p.name,'text','required')}${field('Category — suggested or custom','category',p.category,'text','list="categories" required')}<datalist id="categories"><option>Candy store</option><option>Electrician</option><option>Auto repair</option><option>Florist</option><option>Dance studio</option><option>Barber</option><option>Other local business</option></datalist>${field('Location','location',p.location)}${field('Google Place ID (if available)','placeId',p.placeId)}${pick('Snapshot source','sourceKind',['Manual / public source','Google Places'],p.sourceKind)}${field('Observed / retrieval date','observed',p.observed,'date')}</div>${field('Source URL','sourceUrl',p.sourceUrl,'url')}${pick('Website listing state','websiteState',['Unknown','Listed','Not listed in Places'],p.websiteState)}${field('Actual website URL (preserved even if not listed)','website',p.website,'url')}<div class="form-grid">${field('Google Places rating (blank = unknown)','rating',p.rating,'number','min="0" max="5" step="0.1"')}${field('Review count (blank = unknown)','reviews',p.reviews,'number','min="0" step="1"')}${pick('Phone listing state','phoneState',['Unknown','Listed','Not listed'],p.phoneState)}${field('Actual listed phone — never invented','phone',p.phone)}</div>${!edit?pick('Research method','method',METHODS,METHODS[0]):''}`,'snapshot-form');}
function evidenceForm(e){modal(e?'Edit public evidence':'Add public evidence',`<input type="hidden" name="recordKey" value="${escape(e?.id||'')}">${pick('Kind','kind',['Fact','Signal','Hypothesis','Unknown'],e?.kind||'Fact')}${area('Public observation / claim / unresolved question','claim',e?.claim||'','required')}${field('Evidence URL (required for public claims)','url',e?.url||'','url')}${field('Observed / retrieval date','date',e?.date||localDate(),'date','required')}<p class="hint">Fact is observable. Signal is your interpretation. Hypothesis is testable. Unknown is unresolved. Owner reports belong in the activity form, not here.</p>`,'evidence-form');}
function activityForm(type='Research',existing=null,preset={}){const t=target();const a=existing||{id:'',targetId:view==='targets'&&t?t.id:'General',lane:view==='targets'&&t?t.user.lane:'digital-services',method:t?.user.method||METHODS[0],type,date:localDate(),minutes:null,notes:'',friction:'',ownerWords:'',speaker:'',ownerVerified:false,ownerPain:false,workaround:'',outreachId:'',...preset};modal(existing?'Edit activity':'Log actual activity',`<input type="hidden" name="recordKey" value="${escape(a.id)}"><input type="hidden" name="outreachId" value="${escape(a.outreachId)}"><div class="form-grid">${pick('Target','targetId',[['General','General / discarded candidate'],...state.targets.map(t=>[t.id,t.provider.name])],a.targetId)}${pick('Activity type','type',a.type==='Outreach'?['Outreach']:ACTIVITY_TYPES.filter(x=>x!=='Outreach'),a.type)}${field('Date (Boise)','date',a.date,'date','required')}${pick('Research method','method',METHODS,a.method)}${field('Actual minutes (blank = not logged)','minutes',a.minutes,'number','min="0" step="0.1"')}${field('Speaker / role, when reporting owner words','speaker',a.speaker)}</div>${area('What happened / your interpretation','notes',a.notes)}${area('Workflow friction / awkward or missing step','friction',a.friction)}${area('Owner’s exact words','ownerWords',a.ownerWords)}${tick('I verified the speaker is the owner or decision-maker.','ownerVerified',a.ownerVerified)}${tick('These words express a concrete problem / pain; this is not just politeness.','ownerPain',a.ownerPain)}${area('Current workaround / what works well','workaround',a.workaround)}`,'activity-form');}
function draftForm(d){const t=target();const newDraft={id:'',created:localDate(),subject:'A question about '+t.provider.name,body:`Hi ${t.provider.name} team, I’m ${state.profile.name||'[your name]'}. I’m learning about local business workflows and whether there is useful work I could offer. ${t.user.question||'What result would you most like to improve, if anything?'} Would you be open to a brief conversation? No problem if this is not a priority.`};const x=d||newDraft;modal(d?'Edit learning draft':'Draft a learning message',`<input type="hidden" name="recordKey" value="${escape(x.id)}">${field('Subject','subject',x.subject)}${area('Exact draft for your review','body',x.body,'required rows="8"')}<p class="hint">Editing returns this message to Draft. No templates claim a missing website, existing preview, expertise or promised result.</p>`,'draft-form');}
function sendForm(d){const t=target();modal('Record a message you already sent',`<input type="hidden" name="recordKey" value="${escape(d.id)}"><p class="hint">This records your manual action; it does not send the message. Preserve the exact reviewed text.</p><pre>${escape(d.body)}</pre>${field('Actual send date','date',localDate(),'date','required')}${field('Actual recipient','recipient',t.user.contact,'text','required')}${field('Actual channel','channel',t.user.channel,'text','required')}${field('Actual outreach minutes (blank = not logged)','minutes','','number','min="0" step="0.1"')}`,'sent-form');}
function lineRow(i={description:'',quantity:1,unit:null}){return `<div class="line-input"><label>Description<input name="lineDescription" value="${escape(i.description)}" required></label><label>Qty<input name="lineQuantity" type="number" value="${i.quantity}" min="0.01" max="1000000" step="0.01" required></label><label>Unit USD<input name="lineUnit" type="number" value="${i.unit??''}" min="0" max="100000000" step="0.01" required></label>${b('×','removeLine','class="text" aria-label="Remove line item"')}</div>`;}
function quoteForm(q){modal(q?'Edit recorded quote':'Record an existing quote',`<input type="hidden" name="recordKey" value="${escape(q?.id||'')}"><div class="form-grid">${field('Quote title','title',q?.title||'','text','required')}${field('Unique quote reference','reference',q?.reference||'','text','required')}${pick('Quote status','status',['Draft','Pending','Accepted','Declined','Voided'],q?.status||'Draft')}${field('Original quote date (blank = unknown)','date',q?.date||'','date')}</div><div id="line-items">${(q?.items||[{}]).map(i=>lineRow(i.description===undefined?undefined:i)).join('')}</div>${b('+ Line item','addLine','class="quiet small"')}${area('Scope limits / provenance / terms / what remains unconfirmed','note',q?.note||'')}<p class="hint">${offerReady(state,target())?'Owner evidence and delivery capability are recorded.':'New offer prerequisites are not complete. Use this form to record historical facts; keep new proposals in Draft until discovery and delivery fit are confirmed.'} Quote revisions edit the existing reference. Payment is tracked independently.</p>`,'quote-form');}
function transactionForm(kind,p){modal(kind==='payments'?'Record received payment':'Record expense',`<input type="hidden" name="recordKey" value="${escape(p?.id||'')}"><input type="hidden" name="transactionKind" value="${kind}">${field('Unique receipt / transaction reference','reference',p?.reference||'','text','required')}<div class="form-grid">${field('Actual date','date',p?.date||localDate(),'date','required')}${field('Actual amount USD (blank = unrecorded)','amount',p?.amount,'number','min="0" max="100000000" step="0.01"')}</div>${pick('Related quote (optional)','quoteId',[['','No quote linked'],...target().quotes.map(q=>[q.id,q.title+' / '+q.reference])],p?.quoteId||'')}${area('Work / status / receipt note','note',p?.note||'','required')}<p class="hint">Use 0 only for a known zero. Never treat an accepted quote as money received.</p>`,'transaction-form');}
function episodeForm(e){modal('Odd Jobs episode journal',`<input type="hidden" name="recordKey" value="${escape(e?.id||'')}">${field('Episode / idea title','title',e?.title||'','text','required')}${pick('Production status','status',['Idea','Planned','Published'],e?.status||'Idea')}${field('Actual published / media URL','url',e?.url||'','url')}${area('Before / after / lesson / media notes / filming permission','note',e?.note||'')}`,'episode-form');}
function serviceForm(s){modal(s?'Edit service capability':'Add a service',`<input type="hidden" name="recordKey" value="${escape(s?.id||'')}">${field('Service name','name',s?.name||'','text','required')}${area('Realistic scope, tools and quality checks','scope',s?.scope||'','required')}${tick('I can confidently deliver this service today.','confirmed',s?.confirmed||false)}`,'service-form');}
function download(filename,content){const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));const anchor=document.createElement('a');anchor.href=url;anchor.download=filename;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function resetReviewed(s,t){t.outreach.forEach(d=>{if(d.status==='Reviewed'&&!canReview(s,t,d))d.status='Draft';});}
function timerStore(){try{timer?sessionStorage.setItem(STORAGE+'.timer',JSON.stringify(timer)):sessionStorage.removeItem(STORAGE+'.timer');}catch{}}
app.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,key=el.dataset.key,t=target();try{
 if(action==='home'){event.preventDefault();view='targets';render();}
 if(action==='nav'){view=el.dataset.view;render();}
 if(action==='target'||action==='targetMoney'){selected=key;view='targets';section=action==='targetMoney'?'money':'understand';render();if(innerWidth<=900)document.querySelector('.target-card').scrollIntoView({behavior:'smooth',block:'start'});}
 if(action==='back')document.querySelector('.target-list').scrollIntoView({behavior:'smooth',block:'start'});
 if(action==='section'){section=key;render();}
 if(action==='capture')snapshotForm();if(action==='snapshot')snapshotForm(true);
 if(action==='evidence')evidenceForm();if(action==='editEvidence')evidenceForm(t.evidence.find(e=>e.id===key));
 if(action==='activity')activityForm();if(action==='conversation')activityForm('Conversation');if(action==='general')activityForm('Research',null,{targetId:'General',lane:'digital-services',method:METHODS[0]});
 if(action==='editActivity')activityForm('',state.activities.find(a=>a.id===key));
 if(action==='newDraft')draftForm();if(action==='editDraft'){const d=t.outreach.find(d=>d.id===key);if(d.status==='Sent')throw Error('Sent messages remain immutable. Create a new draft.');draftForm(d);}
 if(action==='reviewDraft')update(s=>{const x=s.targets.find(x=>x.id===selected),d=x.outreach.find(d=>d.id===key);if(!canReview(s,x,d))throw Error('Record your name, a Pursue decision with drop criteria, and a verified contact route before reviewing.');d.status='Reviewed';},'Marked reviewed. You send it yourself.');
 if(action==='sendRecord'){const d=t.outreach.find(d=>d.id===key);if(d.status!=='Reviewed'||!canReview(state,t,d))throw Error('Review this draft and contact route first.');sendForm(d);}
 if(action==='copyDraft'){const d=t.outreach.find(d=>d.id===key);if(d.status==='Draft')throw Error('Review the draft before copying it for outreach.');try{await navigator.clipboard.writeText(d.subject+'\n\n'+d.body);notify('Copied. No message was sent.');}catch{modal('Copy reviewed text',`<textarea readonly rows="10">${escape(d.subject+'\n\n'+d.body)}</textarea>`,'copy-form');}}
 if(action==='quote')quoteForm();if(action==='editQuote')quoteForm(t.quotes.find(q=>q.id===key));if(action==='payment')transactionForm('payments');if(action==='expense')transactionForm('expenses');if(action==='editPayment')transactionForm('payments',t.payments.find(p=>p.id===key));if(action==='editExpense')transactionForm('expenses',t.expenses.find(p=>p.id===key));
 if(action==='episode')episodeForm();if(action==='editEpisode')episodeForm(t.episodes.find(e=>e.id===key));if(action==='service')serviceForm();if(action==='editService')serviceForm(state.services.find(s=>s.id===key));
 if(action==='export')modal('Portable JSON backup',`${area('Complete backup — copy this text or download the file','payload',JSON.stringify(state,null,2),'readonly rows="12"')}<div class="actions">${b('Download JSON file','downloadBackup','class="quiet"')}</div><p class="hint">Keep this backup before clearing browser data. It includes all provider snapshots and your work.</p>`,'copy-form');if(action==='import')modal('Restore JSON backup',`${area('Paste the complete Scouter ChatGPT 3.5 backup','backup','','required rows="10"')}${b('Choose JSON file','chooseBackup','class="quiet"')}<p class="hint">Saving replaces this browser’s workspace after validation. Export your current data first. Other builds have different schemas and will be rejected.</p>`,'restore-form');
 if(action==='timer'){if(!timer){timer={started:Date.now(),targetId:view==='targets'&&t?t.id:'General',lane:view==='targets'&&t?t.user.lane:'digital-services',method:t?.user.method||METHODS[0],date:localDate()};timerStore();render();notify('Research timer started. Stop it to review actual minutes.');}else{activityForm('Research',null,{targetId:timer.targetId,lane:timer.lane,method:timer.method,date:timer.date,minutes:Math.round((Date.now()-timer.started)/6000)/10});}}
 }catch(error){notify(error.message);}});
app.addEventListener('input',event=>{if(event.target.id==='query'){query=event.target.value;const cursor=event.target.selectionStart;render();const input=document.querySelector('#query');input.focus();input.setSelectionRange(cursor,cursor);}});
app.addEventListener('change',async event=>{if(event.target.name==='lane'){lane=event.target.value;render();}if(event.target.name==='stage'&&event.target.closest('.filters')){stage=event.target.value;render();}if(event.target.id==='restore-input'&&event.target.files[0]){try{const file=event.target.files[0];if(file.size>10000000)throw Error('Backup is too large (maximum 10 MB).');const incoming=validate(JSON.parse(await file.text()));modal('Restore validated JSON backup?',`<p>This replaces this browser’s workspace with ${incoming.targets.length} targets and ${incoming.activities.length} activities. Export the current workspace first if you need to keep it.</p><textarea name="backup" hidden>${escape(JSON.stringify(incoming))}</textarea>`,'restore-form');}catch(error){notify('Backup not restored: '+error.message);}}});
dialog.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='close')dialog.close();if(el.dataset.action==='downloadBackup'){download('scouter-chatgpt-35-'+localDate()+'.json',JSON.stringify(state,null,2));notify('Backup download requested. You can also copy the JSON shown here.');}if(el.dataset.action==='chooseBackup')document.querySelector('#restore-input').click();if(el.dataset.action==='addLine')document.querySelector('#line-items').insertAdjacentHTML('beforeend',lineRow());if(el.dataset.action==='removeLine')el.closest('.line-input').remove();});
const assign=(object,f,keys)=>keys.forEach(k=>object[k]=f[k]??'');
const upsert=(array,record)=>{const index=array.findIndex(x=>x.id===record.id);index<0?array.push(record):array.splice(index,1,record);};
document.addEventListener('submit',event=>{const form=event.target;if(!form.id.endsWith('-form'))return;event.preventDefault();const f=Object.fromEntries(new FormData(form));try{
 const closeAfter=()=>dialog.open&&dialog.close();
 if(form.id==='snapshot-form'){const p=snapshot();assign(p,f,['placeId','name','category','location','sourceKind','sourceUrl','observed','websiteState','website','phoneState','phone']);p.placeId=p.placeId.trim();p.rating=numeric(f.rating);p.reviews=numeric(f.reviews);const newId=uid();update(s=>{if(f.recordKey){const t=s.targets.find(t=>t.id===f.recordKey);t.providerHistory.push(copy(t.provider));t.provider=p;}else{const t=makeTarget(p.name,p.category);t.id=newId;t.provider=p;t.user.method=f.method;s.targets.push(t);}},'Snapshot captured; qualification remains yours.');if(!f.recordKey)selected=newId;view='targets';section='understand';render();closeAfter();}
 if(form.id==='evidence-form'){update(s=>upsert(s.targets.find(t=>t.id===selected).evidence,{id:f.recordKey||uid(),kind:f.kind,claim:f.claim,url:f.url,date:f.date}));closeAfter();}
 if(form.id==='decision-form')update(s=>{const t=s.targets.find(t=>t.id===selected);assign(t.user,f,['decision','stage','method','question','counter','drop','notes','nextAction','due','ownerResult','problem','serviceId']);t.user.deliveryConfirmed=f.deliveryConfirmed==='on';resetReviewed(s,t);});
 if(form.id==='route-form')update(s=>{const t=s.targets.find(t=>t.id===selected);assign(t.user,f,['contact','channel']);t.user.contactVerified=f.contactVerified==='on';t.outreach.forEach(d=>{if(d.status==='Reviewed')d.status='Draft';});});
 if(form.id==='draft-form'){update(s=>{const t=s.targets.find(t=>t.id===selected),old=t.outreach.find(d=>d.id===f.recordKey);if(old?.status==='Sent')throw Error('Cannot edit a sent message.');upsert(t.outreach,{id:f.recordKey||uid(),subject:f.subject,body:f.body,status:'Draft',created:old?.created||localDate(),sentDate:'',recipient:'',channel:''});});closeAfter();}
 if(form.id==='sent-form'){update(s=>{const t=s.targets.find(t=>t.id===selected),d=t.outreach.find(d=>d.id===f.recordKey);if(d.status!=='Reviewed'||!canReview(s,t,d))throw Error('This message must be reviewed first.');d.status='Sent';d.sentDate=f.date;d.recipient=f.recipient;d.channel=f.channel;t.user.stage='Outreach';s.activities.push({id:uid(),targetId:t.id,lane:t.user.lane,method:t.user.method,type:'Outreach',date:f.date,minutes:numeric(f.minutes),notes:'Manually sent: '+d.subject,friction:'',ownerWords:'',speaker:'',ownerVerified:false,ownerPain:false,workaround:'',outreachId:d.id});},'Manual send recorded. No message was sent by Scouter.');closeAfter();}
 if(form.id==='activity-form'){const old=state.activities.find(a=>a.id===f.recordKey);const a={id:f.recordKey||uid(),targetId:f.targetId,lane:f.targetId==='General'?'digital-services':state.targets.find(t=>t.id===f.targetId)?.user.lane,method:f.method,type:f.type,date:f.date,minutes:numeric(f.minutes),notes:f.notes,friction:f.friction,ownerWords:f.ownerWords,speaker:f.speaker,ownerVerified:f.ownerVerified==='on',ownerPain:f.ownerPain==='on',workaround:f.workaround,outreachId:old?.outreachId||''};if(old?.type==='Outreach'&&(old.targetId!==a.targetId||a.type!=='Outreach'))throw Error('A sent-message activity must stay with its original target.');update(s=>upsert(s.activities,a));closeAfter();if(timer&&a.type==='Research'&&a.targetId===timer.targetId){timer=null;timerStore();render();}}
 if(form.id==='quote-form'){const data=new FormData(form);const descriptions=data.getAll('lineDescription'),quantities=data.getAll('lineQuantity'),units=data.getAll('lineUnit');update(s=>{const t=s.targets.find(t=>t.id===selected);upsert(t.quotes,{id:f.recordKey||uid(),reference:f.reference.trim(),title:f.title,date:f.date,status:f.status,items:descriptions.map((description,i)=>({description,quantity:Number(quantities[i]),unit:Number(units[i])})),note:f.note});});closeAfter();}
 if(form.id==='transaction-form'){if(!['payments','expenses'].includes(f.transactionKind))throw Error('Unknown transaction type.');update(s=>upsert(s.targets.find(t=>t.id===selected)[f.transactionKind],{id:f.recordKey||uid(),reference:f.reference.trim(),date:f.date,amount:numeric(f.amount),note:f.note,quoteId:f.quoteId}));closeAfter();}
 if(form.id==='episode-form'){update(s=>upsert(s.targets.find(t=>t.id===selected).episodes,{id:f.recordKey||uid(),title:f.title,status:f.status,url:f.url,note:f.note}));closeAfter();}
 if(form.id==='profile-form')update(s=>{assign(s.profile,f,['name','skills','tools','availability','radius','goals','limits','channels']);s.targets.forEach(t=>resetReviewed(s,t));});
 if(form.id==='service-form'){update(s=>upsert(s.services,{id:f.recordKey||uid(),name:f.name,scope:f.scope,confirmed:f.confirmed==='on'}));closeAfter();}
 if(form.id==='weights-form')update(s=>Object.keys(s.weights).forEach(k=>s.weights[k]=Number(f[k])));
 if(form.id==='experiment-form')update(s=>assign(s.experiment,f,['start','end','baselinePlan']));
 if(form.id==='synthesis-form')update(s=>assign(s.experiment,f,['worth','weakened','missing','conclusion','next']));
 if(form.id==='restore-form'){persist(validate(JSON.parse(f.backup)));selected=state.targets[0]?.id;timer=null;timerStore();view='targets';section='understand';render();closeAfter();notify('Validated backup restored.');}
 if(form.id==='copy-form')closeAfter();
 }catch(error){const el=form.querySelector('.error');if(el)el.textContent=error.message;else notify(error.message);}});
render();
</script></body></html>
